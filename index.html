<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakumee</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#16171c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kakumee">
</head>
<body>
    <div class="app">
        <div class="filter-overlay" id="filterOverlay"></div>
        <aside class="filter-drawer" id="filterDrawer">
            <div class="filter-drawer-header">
                <span class="filter-drawer-title">フィルター</span>
                <button id="filterCloseBtn" class="filter-close-btn">✕</button>
            </div>
            <div class="filter-panel">
                <div class="calendar">
                    <div class="calendar-header">
                        <button id="calPrevBtn" class="cal-nav">&#8249;</button>
                        <span id="calTitle" class="cal-title"></span>
                        <button id="calNextBtn" class="cal-nav">&#8250;</button>
                    </div>
                    <div class="calendar-grid" id="calGrid"></div>
                    <button id="calClearBtn" class="cal-clear" hidden>絞り込み解除</button>
                </div>
                <div class="tag-filter-section">
                    <div class="tag-filter-header">
                        <span class="tag-filter-title">タグ</span>
                        <button id="tagClearBtn" class="tag-clear-btn" hidden>解除</button>
                    </div>
                    <div id="tagFilterList" class="tag-filter-list"></div>
                </div>
                <div class="format-filter-section">
                    <div class="tag-filter-header">
                        <span class="tag-filter-title">形式</span>
                        <button id="formatClearBtn" class="tag-clear-btn" hidden>解除</button>
                    </div>
                    <div class="tag-filter-list">
                        <span class="tag-filter-chip" data-format="text">メモ</span>
                        <span class="tag-filter-chip" data-format="todo">TODO</span>
                        <span class="tag-filter-chip" data-format="markdown">Markdown</span>
                    </div>
                </div>
            </div>
        </aside>
        <aside class="sidebar">
            <div class="sidebar-header">
                <button id="filterBtn" class="filter-open-btn">フィルター</button>
                <span class="sidebar-title">Kakumee</span>
                <button id="newNoteBtn" class="new-note-btn">+ 新規</button>
            </div>
            <div class="sidebar-actions">
                <div class="sidebar-action-row">
                    <button id="storageInfoBtn" class="storage-info-btn">⚠ データの保存について</button>
                    <div class="csv-controls">
                        <button id="exportBtn" class="action-btn">↓ CSV出力</button>
                        <label class="action-btn import-label">
                            ↑ CSV取り込み
                            <input type="file" id="importInput" accept=".csv" hidden>
                        </label>
                    </div>
                </div>
                <div id="storageInfoPanel" class="storage-info-panel" hidden>
                    <p class="storage-info-body">このアプリのデータは <strong>ブラウザのローカルストレージ</strong> に保存されています。そのため、以下の操作でデータが失われる可能性があります。</p>
                    <ul class="storage-info-list">
                        <li>ブラウザのキャッシュ・Cookie のクリア</li>
                        <li>ブラウザのアンインストール</li>
                        <li>別のブラウザやデバイスからのアクセス</li>
                    </ul>
                    <p class="storage-info-body">大切なメモは定期的に <strong>↓ CSV出力</strong> でバックアップを取ることをおすすめします。</p>
                </div>
            </div>
            <ul id="noteList" class="note-list"></ul>
        </aside>
        <main class="editor">
            <div class="editor-top-bar">
                <button id="backBtn" class="back-btn">← 戻る</button>
                <div class="editor-top-actions">
                    <button id="deleteBtn" class="delete-btn-top">削除</button>
                </div>
            </div>
            <div class="editor-content">
                <div class="tag-editor">
                    <div id="tagList" class="tag-list"></div>
                    <input id="tagInput" class="tag-input" type="text" placeholder="タグを追加" list="tagSuggestions" autocomplete="off">
                    <datalist id="tagSuggestions"></datalist>
                    <button id="tagAddBtn" class="add-btn">+</button>
                </div>
                <div class="editor-header">
                    <select id="formatSelect" class="format-select">
                        <option value="text">メモ</option>
                        <option value="todo">TODO</option>
                        <option value="markdown">Markdown</option>
                    </select>
                </div>
                <div class="title-row">
                    <input id="titleInput" class="title-input" type="text" placeholder="タイトル">
                </div>
                <div id="editorBody" class="editor-body">
                    <textarea id="bodyInput" class="body-input" placeholder="メモを入力..."></textarea>
                    <div id="previewPane" class="preview-pane" hidden></div>
                    <div id="todoPane" class="todo-pane" hidden>
                        <ul id="todoItems" class="todo-items"></ul>
                        <div class="todo-add">
                            <input id="todoInput" class="todo-input" type="text" placeholder="タスクを追加">
                            <button id="todoAddBtn" class="add-btn">+</button>
                        </div>
                    </div>
                </div>
                <div id="favoritePane" class="favorite-pane">
                    <div class="favorite-url-row">
                        <input id="favoriteUrlInput" class="favorite-url-input" type="url" placeholder="URLを入力">
                        <button id="favoriteCheckBtn" class="favorite-check-btn">確認</button>
                    </div>
                    <div id="favoriteStatus" class="favorite-status"></div>
                    <div id="favoriteSiteInfo" class="favorite-site-info" hidden>
                        <img id="favoriteSiteImage" class="favorite-site-image" src="" alt="" hidden>
                        <div class="favorite-site-details">
                            <div id="favoriteSiteTitle" class="favorite-site-title"></div>
                            <div id="favoriteSiteDesc" class="favorite-site-desc"></div>
                            <a id="favoriteSiteLink" class="favorite-site-link" target="_blank" rel="noopener noreferrer"></a>
                        </div>
                    </div>
                    <div class="favorite-notify-row">
                        <label class="favorite-notify-label">
                            <input type="checkbox" id="favoriteNotifyCheck">
                            サイトの更新を通知する
                        </label>
                        <span id="favoriteLastChecked" class="favorite-last-checked"></span>
                    </div>
                </div>
                <div class="editor-footer">
                    <span id="updatedAt" class="updated-at"></span>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
